[workspace]
resolver = "2"
members = [
    "crates/cf-trace",
    "crates/cf-lang",
    "crates/cf-vm",
    "crates/cf-analysis",
    "crates/cf-ptrace",
    "crates/cf-server",
    "crates/chronoforge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Anmol Advani"]
repository = "https://github.com/coolstack-coder/ChronoForge"
rust-version = "1.88"

[workspace.dependencies]
cf-trace = { path = "crates/cf-trace" }
cf-lang = { path = "crates/cf-lang" }
cf-vm = { path = "crates/cf-vm" }
cf-analysis = { path = "crates/cf-analysis" }
cf-ptrace = { path = "crates/cf-ptrace" }
cf-server = { path = "crates/cf-server" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
anyhow = "1"
lz4_flex = "0.11"
crc32fast = "1.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protox = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
