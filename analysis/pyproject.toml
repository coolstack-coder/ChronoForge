[project]
name = "chronoforge-ai"
version = "0.1.0"
description = "Optional LLM narrator for ChronoForge root-cause reports"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chronoforge_ai"]
