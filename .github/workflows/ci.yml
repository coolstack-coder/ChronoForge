name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the arm runner exercises the aarch64 ptrace + vDSO code paths
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: surface test failures
        if: failure()
        shell: bash
        run: bash .github/annotate.sh test.log

  rocksdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test -p cf-trace --features rocksdb 2>&1 | tee test.log
      - name: surface test failures
        if: failure()
        shell: bash
        run: bash .github/annotate.sh test.log

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "analysis[dev]"
      - run: pytest analysis -q

  # Records examples/native/flaky.c under ptrace on a real kernel and
  # publishes the trace (gzip+base64) as annotations, so the macOS UI can
  # show a genuine Linux recording.
  native-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p chronoforge
      - run: cc -O0 -g -o flaky examples/native/flaky.c
      - name: record until it crashes
        shell: bash
        run: |
          for i in $(seq 1 40); do
            ./target/debug/chronoforge native record -o flaky.json --stdin-text 'GET /\nGET /health\n' -- ./flaky || true
            grep -q '"Signal"' flaky.json && break
          done
          ./target/debug/chronoforge native show flaky.json
          ./target/debug/chronoforge native replay flaky.json
          ./target/debug/chronoforge native replay flaky.json --at "$(python3 -c 'import json;e=json.load(open("flaky.json"))["events"];print(next((i for i,x in enumerate(e) if "Signal" in x["kind"]), len(e)-2))')"
      - run: bash .github/publish-sample.sh flaky.json 0
      - run: bash .github/publish-sample.sh flaky.json 1
      - run: bash .github/publish-sample.sh flaky.json 2
      - run: bash .github/publish-sample.sh flaky.json 3
      - run: bash .github/publish-sample.sh flaky.json 4
      - run: bash .github/publish-sample.sh flaky.json 5
